name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      push_images:
        description: Push images to the registry
        type: boolean
        default: false

env:
  REGISTRY: ${{ vars.ACR_LOGIN_SERVER || 'ghcr.io' }}

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: api
            context: apps/api
          - image: web
            context: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/azure-ai-command-center-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Log in to the registry
        if: github.event_name != 'pull_request' && (github.ref_type == 'tag' || inputs.push_images)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Build (and optionally push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.ref_type == 'tag' || inputs.push_images == true }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose-smoke-test:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build postgres redis qdrant migrate api
      - name: Wait for readiness
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8000/health/ready | grep -q '"status":"ready"'; then
              echo "API is ready."
              exit 0
            fi
            sleep 3
          done
          echo "API never became ready."
          docker compose logs api
          exit 1
      - name: Seed and verify
        run: |
          docker compose run --rm seed
          curl -sf http://localhost:8000/openapi.json > /dev/null
      - name: Tear down
        if: always()
        run: docker compose down -v
