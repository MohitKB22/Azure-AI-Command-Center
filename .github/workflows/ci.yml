name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        # Non-blocking while annotations are completed; remove the flag to gate on types.
        run: mypy app --ignore-missing-imports || true

      - name: Verify migrations from an empty database
        env:
          DATABASE_URL: sqlite:///./ci-migrations.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check

      - name: Tests
        env:
          ENVIRONMENT: local
          SECRET_KEY: ci-secret-key-that-is-long-enough-for-tests
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: apps/api/coverage.xml
          if-no-files-found: ignore

  backend-postgres:
    name: Backend integration (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aicc
          POSTGRES_PASSWORD: aicc
          POSTGRES_DB: aicc
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aicc" --health-interval 5s
          --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Migrate and seed against PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://aicc:aicc@localhost:5432/aicc
          LOCAL_BLOB_DIR: /tmp/blobs
        run: |
          alembic upgrade head
          python -m app.db.seed
      - name: Tests against PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://aicc:aicc@localhost:5432/aicc
          LOCAL_BLOB_DIR: /tmp/blobs
          SECRET_KEY: ci-secret-key-that-is-long-enough-for-tests
        run: pytest -q

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci || npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Start the API with seed data
        working-directory: apps/api
        env:
          DATABASE_URL: sqlite:///./e2e.db
          LOCAL_BLOB_DIR: /tmp/e2e-blobs
          SECRET_KEY: e2e-secret-key-that-is-long-enough-here
          CORS_ORIGINS: http://localhost:5173
        run: |
          pip install -e ".[dev]"
          alembic upgrade head
          python -m app.db.seed
          nohup uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health/ready && break || sleep 2
          done

      - name: Run Playwright
        working-directory: apps/web
        env:
          VITE_API_BASE_URL: http://localhost:8000
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium
          npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if a .env file was committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "A .env file is tracked in git. Remove it and rotate the credentials."
            exit 1
          fi

      - name: Scan for hard-coded secrets
        run: |
          # Deliberately narrow patterns: real credential shapes, not the word "password".
          if git grep -nEI \
            -e 'AccountKey=[A-Za-z0-9+/=]{20,}' \
            -e 'sk-[A-Za-z0-9]{20,}' \
            -e 'AZURE_OPENAI_API_KEY=[^\s"'"'"']+' \
            -e 'BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' \
            -- ':!*.example' ':!docs/*' ':!.github/*'; then
            echo "Potential secret committed. Remove it and rotate the credential."
            exit 1
          fi
          echo "No credential-shaped strings found."

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Python dependency audit
        run: |
          pip install pip-audit
          pip-audit --strict -r <(pip install -e apps/api --dry-run --report - 2>/dev/null | true) || \
            echo "pip-audit completed with findings; review the log."

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit
        working-directory: apps/web
        run: npm audit --audit-level=high || echo "npm audit reported findings; review the log."
