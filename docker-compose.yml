name: azure-ai-command-center

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aicc
      POSTGRES_PASSWORD: aicc
      POSTGRES_DB: aicc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicc -d aicc"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.11.0
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://aicc:aicc@postgres:5432/aicc
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./apps/api
    environment:
      ENVIRONMENT: local
      DEMO_MODE: "true"
      DATABASE_URL: postgresql+psycopg://aicc:aicc@postgres:5432/aicc
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-key-change-me}
      CORS_ORIGINS: http://localhost:5173,http://localhost:4173
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      VECTOR_STORE: ${VECTOR_STORE:-local}
      BLOB_PROVIDER: local
      LOCAL_BLOB_DIR: /app/var/blobs
      QDRANT_URL: http://qdrant:6333
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_CHAT_DEPLOYMENT: ${AZURE_OPENAI_CHAT_DEPLOYMENT:-}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-}
    ports:
      - "8000:8000"
    volumes:
      - blobdata:/app/var/blobs
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/live').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12

  seed:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://aicc:aicc@postgres:5432/aicc
      LOCAL_BLOB_DIR: /app/var/blobs
      DEMO_MODE: "true"
    command: ["python", "-m", "app.db.seed"]
    volumes:
      - blobdata:/app/var/blobs
    depends_on:
      api:
        condition: service_healthy
    restart: "no"
    profiles: ["seed"]

  worker:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://aicc:aicc@postgres:5432/aicc
      LOCAL_BLOB_DIR: /app/var/blobs
      COLLECT_INTERVAL_SECONDS: "60"
    command: ["python", "-m", "app.worker"]
    volumes:
      - blobdata:/app/var/blobs
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  blobdata:
